name: 1. Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bump type (patch/minor/major) or explicit version (e.g. 1.2.3)"
        required: true
        default: "patch"

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  release-prep:
    name: Release Prep
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release commit
      pull-requests: write # to open the draft release PR
    environment:
      name: release-prep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          install-only: true

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: uv run --script noxfile.py -s release_prep -- "$RELEASE_VERSION" --yes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}

      - run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -u origin HEAD
          pr_url=$(gh pr create --draft --base main \
            --title "$(git log -1 --pretty=%s)" \
            --body "$(git log -1 --pretty=%b)")
          {
            echo "## Draft PR ready"
            echo ""
            echo "[$pr_url]($pr_url) is ready for review. Once CI passes and it's merged, run the **2. Release Draft** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
