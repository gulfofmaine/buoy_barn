name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.10.3) - must already be merged into main's Changelog.md"
        required: true

permissions:
  contents: write
  actions: write # To dispatch CI for the release build

jobs:
  publish-release:
    runs-on: ubuntu-latest
    environment:
      name: publish-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - run: uv run --script noxfile.py -s publish_release -- "$RELEASE_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}

      # The default GITHUB_TOKEN deliberately does not raise events that start new
      # workflow runs, so the `gh release create` above will not fire CI's
      # `release: published` trigger. workflow_dispatch is the documented exception,
      # so kick off the tagged build and push explicitly.
      - name: Trigger CI to build and push the release image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" \
                 --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"; then
              exit 0
            fi
            echo "Dispatch attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 5))
          done
          exit 1
