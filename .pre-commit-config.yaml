repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        # exclude: tests/data
      - id: check-ast
      - id: check-yaml
      - id: check-xml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-added-large-files
      - id: no-commit-to-branch

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d4acaec07ac3bc6017fba3c3b8e9810af1b615db  # frozen: 0.13.1
    hooks:
      # Update the uv lockfile
      - id: uv-lock
        files: app/pyproject.toml
        args: [--project, app]

  # - repo: https://github.com/codespell-project/codespell
  #   rev: v2.1.0
  #   hooks:
  #     - id: codespell
  #       args:
  #         - --quiet-level=2
  #         - --uri-ignore-words-list=BA
  # exclude: docs/cluster.drawio.svg

  - repo: https://github.com/asottile/add-trailing-comma
    rev: 832dc73b1c9cea082ffcfeae01ae89dfc1ac5043  # frozen: v4.0.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        exclude: .*\/tests\/.*

  - repo: https://github.com/zricethezav/gitleaks/
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
  #       exclude: services/geoapi/data.neracoos.org_geoapi/entrypoint.sh

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 5ccd385680292c5e5b10bedf0a3e509b5e6e9da8  # frozen: 1.33.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "5.0"]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6  # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi, jupyter ]
      args: [ --fix, --exit-non-zero-on-fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi, jupyter ]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
    - id: zizmor

  - repo: https://github.com/gulfofmaine/odp-releaser
    rev: fef1724a2cdd7725a519ebb059a60aca71e24e68
    hooks:
      - id: validate-deploy-targets

update:
  cooldown_days: 7
  freeze: true

default_language_version:
  python: python3.14
