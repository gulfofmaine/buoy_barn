apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: celery
    tier: backend
    role: worker
  name: worker
spec:
  selector:
    matchLabels:
      service: celery
      tier: backend
      role: worker
  template:
    metadata:
      labels:
        service: celery
        tier: backend
        role: worker
    spec:
      containers:
        - name: worker
          image: gmri/neracoos-buoy-barn
          args:
            - celery
            - -A
            - buoy_barn
            - worker
            - -l
            - info
          envFrom:
            - secretRef:
                name: buoy-barn-secrets
            - configMapRef:
                name: buoy-barn-config
          env:
            # Tags every metric with which kind of process produced it.
            - name: BUOY_BARN_OTEL_ROLE
              value: "worker"
            - name: DJANGO_MANAGEPY_MIGRATE
              value: "off"
            - name: DJANGO_MANAGEPY_COLLECTSTATIC
              value: "off"
          volumeMounts:
            - name: django-static
              mountPath: /static
          # The ping traverses the broker, so it catches
          # a worker that has silently lost its Redis connection.
          # Observed exit codes against the real container: 0 healthy, 69 when no node
          # replies, and 1 in ~7s when the broker is unreachable. timeoutSeconds is 20 to
          # sit above that ~7s failure path.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - uv run --frozen celery -A buoy_barn inspect ping -d celery@$HOSTNAME -t 10
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
      volumes:
        - name: django-static
          emptyDir: {}
