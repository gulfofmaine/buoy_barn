apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: celery
    tier: backend
    role: flower
  name: flower
spec:
  selector:
    matchLabels:
      service: celery
      tier: backend
      role: flower
  template:
    metadata:
      labels:
        service: celery
        tier: backend
        role: flower
    spec:
      containers:
        - name: flower
          image: gmri/neracoos-buoy-barn
          args:
            - celery
            - -A
            - buoy_barn
            - flower
            - -l
            - info
          ports:
            - containerPort: 5555
              name: http
          envFrom:
            - secretRef:
                name: buoy-barn-secrets
            - configMapRef:
                name: buoy-barn-config
          env:
            # Tags every metric with which kind of process produced it.
            - name: BUOY_BARN_OTEL_ROLE
              value: "flower"
            - name: DJANGO_MANAGEPY_MIGRATE
              value: "off"
            - name: DJANGO_MANAGEPY_COLLECTSTATIC
              value: "off"
          volumeMounts:
            - name: django-static
              mountPath: /static
          # Flower serves its own /healthcheck (see the installed flower/urls.py), so this
          # is a plain HTTP probe rather than the exec-into-celery one worker/beat use.
          livenessProbe:
            httpGet:
              port: http
              path: /healthcheck
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        - name: django-static
          emptyDir: {}
