name: 2. Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.10.3) - must already be merged into main's Changelog.md"
        required: true

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  release-draft:
    name: Release Draft
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release and update the changelog
    environment:
      name: release-draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: uv run --script noxfile.py -s release_draft -- "$RELEASE_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
