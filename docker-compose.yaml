services:
  db:
    image: postgis/postgis:15-3.3@sha256:a2fc46b52819d25add4ed93d3da83e106e17ea3ace6883cce3791631c9820bb2
    restart: always
    env_file:
      - ./docker-data/secret.env
    environment:
      PGDATA: /var/lib/postgresql/data/PGDATA
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: always

  web:
    build: ./app
    image: gmri/neracoos-buoy-barn
    command: uv run manage.py runserver 0:8090
    # command: "uv run granian --interface asgi --host 0.0.0.0 --port 8090 --workers 4 buoy_barn.asgi:application"
    restart: always
    volumes:
      - ./app:/app:cached
      - /app/.venv
      - ./docker-data/django-static:/static:cached
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./app
    #       target: /app
    #       ignore:
    #         - ./app/.venv
    #     - action: rebuild
    #       path: ./app/pyproject.toml
    ports:
      - "8090:8090"
    environment:
      DJANGO_MANAGEPY_COLLECTSTATIC: "on"
      SENTRY_TRACES_SAMPLE_RATE: 0
      BUOY_BARN_OTEL_ROLE: web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    env_file:
      - ./docker-data/secret.env
    depends_on:
      - db
      - cache

  mqtt:
    build: ./app
    image: gmri/neracoos-buoy-barn
    command: uv run manage.py erddap_mqtt NERACOOS_SEA_EAGLE
    volumes:
      - ./app:/app:cached
      - /app/.venv
      - ./docker-data/django-static:/static:cached
    environment:
      SENTRY_TRACES_SAMPLE_RATE: 0
      BUOY_BARN_OTEL_ROLE: mqtt
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    env_file:
      - ./docker-data/secret.env
    depends_on:
      - db
      - cache
    networks:
      - default
      - erddap_mqtt_network

  celery-worker:
    build: ./app
    image: gmri/neracoos-buoy-barn
    command: celery -A buoy_barn worker -l info
    restart: always
    environment:
      BUOY_BARN_OTEL_ROLE: worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    env_file:
      - ./docker-data/secret.env
    depends_on:
      - db
      - cache

  celery-beat:
    build: ./app
    image: gmri/neracoos-buoy-barn
    command: celery -A buoy_barn beat -l info
    restart: always
    environment:
      BUOY_BARN_OTEL_ROLE: beat
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    env_file:
      - ./docker-data/secret.env
    depends_on:
      - db
      - cache

  celery-flower:
    build: ./app
    image: gmri/neracoos-buoy-barn
    command: celery -A buoy_barn flower -l info
    restart: always
    environment:
      BUOY_BARN_OTEL_ROLE: flower
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    env_file:
      - ./docker-data/secret.env
    depends_on:
      - db
      - cache
    ports:
      - "5555:5555"

  spotlight:
    image: ghcr.io/getsentry/spotlight:latest
    ports:
      - "8969:8969/tcp"

  # Receives metrics from web/worker/beat/mqtt and logs them, so local work can confirm
  # instrumentation without a cluster. `docker compose logs -f otel-collector` is the
  # fastest way to check that the Celery prefork children are exporting.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker-data/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"


networks:
  default:
    name: buoy_barn_network
    driver: bridge
  erddap_mqtt_network:
    name: erddap_mqtt_network
    external: true
