name: 2. Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.10.3) - must already be merged into main's Changelog.md"
        required: true

permissions:
  contents: write

jobs:
  release-draft:
    runs-on: ubuntu-latest
    environment:
      name: release-draft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - run: uv run --script noxfile.py -s release_draft -- "$RELEASE_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
